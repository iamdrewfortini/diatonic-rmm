name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
  source-archive:
    needs: unittest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package approved tracked source
        shell: bash
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          mkdir -p "$staging/diatonic-rmm-0.1.0"
          cp VERSION README.md RELEASE_NOTES.md SHOWCASE.md BRAND_CONTRACT.md LICENSE.md SECURITY.md .gitignore .gitlab-ci.yml "$staging/diatonic-rmm-0.1.0/"
          cp -R api edge ops showcase tests .github "$staging/diatonic-rmm-0.1.0/"
          find "$staging/diatonic-rmm-0.1.0" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$staging/diatonic-rmm-0.1.0" -type f -name '*.py[co]' -delete
          tar -czf diatonic-rmm-0.1.0.tar.gz -C "$staging" diatonic-rmm-0.1.0
          tar -tzf diatonic-rmm-0.1.0.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: diatonic-rmm-0.1.0.tar.gz
          path: diatonic-rmm-0.1.0.tar.gz
          if-no-files-found: error
          retention-days: 30
